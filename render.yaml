# Render.com Blueprint for REDACTED.
# In Render: New + -> Blueprint -> pick this repository. Render reads this file and sets everything up.
services:
  - type: web
    name: redacted
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render asks you for this when you create the Blueprint. Type your admin password there.
      - key: ADMIN_PASSWORD
        sync: false
